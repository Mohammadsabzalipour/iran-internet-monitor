<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پایش وضعیت اینترنت ایران</title>
    <!-- اضافه کردن فونت زیبای وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- اضافه کردن کتابخانه Chart.js برای رسم نمودار -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0f172a; /* رنگ پس‌زمینه تیره */
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .dashboard-card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
            margin-bottom: 20px;
        }
        .info-box {
            background-color: #0f172a;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            text-align: right;
            border-right: 4px solid #38bdf8;
        }
        .info-box p {
            margin: 5px 0;
            font-size: 14px;
            color: #cbd5e1;
        }
        .info-box span {
            color: #f8fafc;
            font-weight: bold;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }
        .status-success { background-color: #065f46; color: #34d399; }
        .status-error { background-color: #7f1d1d; color: #f87171; }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <h1>پایش وضعیت اینترنت ایران 🇮🇷</h1>
        <p class="subtitle">بر اساس داده‌های Cloudflare Radar و IODA</p>

        <div class="chart-container">
            <canvas id="trafficChart"></canvas>
        </div>

        <div class="info-box">
            <p>سهم ترافیک وب (HTTP): <span id="http-val">-</span>٪</p>
            <p>سهم سایر ترافیک‌ها: <span id="other-val">-</span>٪</p>
            <p>آخرین به‌روزرسانی: <span id="last-updated">در حال دریافت...</span></p>
            
            <!-- بخش نمایش داده‌های IODA -->
            <div id="ioda-info" style="margin-top: 15px; border-top: 1px solid #334155; padding-top: 10px;">
                <p style="color: #94a3b8; font-size: 12px;">در حال دریافت داده‌های IODA...</p>
            </div>

            <div id="status-indicator" class="status-badge">در حال بارگذاری...</div>
        </div>
    </div>

    <script>
        // تابع برای دریافت داده‌ها از فایل data.json
        async function fetchData() {
            try {
                // برای اینکه فایل همیشه آخرین نسخه را بخواند، از هدر no-cache استفاده می‌کنیم
                const response = await fetch('data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                // --- بخش Cloudflare ---
                const httpVal = (data.cloudflare && data.cloudflare.http_percent) ? parseFloat(data.cloudflare.http_percent) : 0;
                const otherVal = (data.cloudflare && data.cloudflare.other_percent) ? parseFloat(data.cloudflare.other_percent) : 0;
                
                document.getElementById('http-val').innerText = httpVal.toFixed(1);
                document.getElementById('other-val').innerText = otherVal.toFixed(1);
                
                if (data.last_run) {
                    document.getElementById('last-updated').innerText = new Date(data.last_run).toLocaleString('fa-IR');
                }
                
                // رسم نمودار
                renderChart(httpVal, otherVal);

                // --- بخش IODA ---
                const iodaBox = document.getElementById('ioda-info');
                if (data.ioda) {
                    let bgpText = (data.ioda.bgp_value !== null && data.ioda.bgp_value !== "N/A") ? data.ioda.bgp_value : 'نامشخص';
                    let pingText = (data.ioda.active_probing_value !== null && data.ioda.active_probing_value !== "N/A") ? data.ioda.active_probing_value : 'نامشخص';
                    
                    iodaBox.innerHTML = `
                        <p style="margin-top:5px;">وضعیت IODA (۲۴ ساعت گذشته):</p>
                        <p>BGP (مسیرهای شبکه): <span style="color:#fbbf24;">${bgpText}</span></p>
                        <p>Active Probing (پاسخ‌دهی): <span style="color:#fbbf24;">${pingText}</span></p>
                    `;
                } else {
                    iodaBox.innerHTML = '<p style="color: #f87171;">داده‌های IODA در دسترس نیست.</p>';
                }
                
                // وضعیت اتصال
                const statusEl = document.getElementById('status-indicator');
                if(data.status === 'Success') {
                    statusEl.innerText = 'متصل (داده‌ها به‌روز هستند)';
                    statusEl.className = 'status-badge status-success';
                } else {
                    statusEl.innerText = 'هشدار: داده‌های ناقص';
                    statusEl.className = 'status-badge status-error';
                }

            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('status-indicator').innerText = 'عدم دسترسی به فایل داده‌ها';
                document.getElementById('status-indicator').className = 'status-badge status-error';
                document.getElementById('last-updated').innerText = 'نامشخص';
            }
        }

        // تابع رسم نمودار دایره‌ای
        function renderChart(httpVal, otherVal) {
            const ctx = document.getElementById('trafficChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['ترافیک وب (HTTP)', 'سایر ترافیک‌ها'],
                    datasets: [{
                        data: [httpVal, otherVal],
                        backgroundColor: [
                            '#38bdf8', // رنگ آبی برای HTTP
                            '#475569'  // رنگ خاکستری برای بقیه
                        ],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#e2e8f0',
                                font: { family: 'Vazirmatn' }
                            }
                        }
                    }
                }
            });
        }

        // اجرای تابع هنگام لود شدن صفحه
        fetchData();
    </script>
</body>
</html>
